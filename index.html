<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <title>خانه</title>
  </head>
  <body>
    <!-- =============== HEADER =============== -->
    <header class="header">
      <div class="header__container container">
        <nav class="header__navbar navbar">
          <ul class="navbar__menu menu">
            <!-- LOGO -->
            <li class="menu__item">
              <a href="#">
                <picture class="logo">
                  <source
                    srcset="assets/images/logo/digitize-mobile-logo.svg"
                    media="(max-width:767px)"
                  />
                  <source
                    srcset="assets/images/logo/digitize-desktop-logo.svg"
                    media="(min-width:768px)"
                  />
                  <img
                    src="assets/images/logo/digitize-desktop-logo.svg"
                    alt="Digitize"
                  />
                </picture>
              </a>
            </li>
            <!-- LINKS -->
            <li class="menu__item">
              <ul class="submenu">
                <li class="submenu__item">
                  <a class="menu__link link" href="#">خانه</a>
                </li>
                <li class="submenu__item">
                  <a class="menu__link link" href="#">موبایل</a>
                </li>
                <li class="submenu__item">
                  <a class="menu__link link" href="#">لپ تاپ</a>
                </li>
                <li class="submenu__item">
                  <a class="menu__link link" href="#">ساعت هوشمند</a>
                </li>
              </ul>
            </li>
            <!-- SEARCH FORM -->
            <li class="menu__item">
              <form class="menu__search-form">
                <img
                  class="menu__search-icon"
                  src="assets/images/icons/search-normal.svg"
                  alt="search"
                />
                <input
                  class="menu__search-input"
                  type="search"
                  name="search field"
                  placeholder="جستجوی نام محصول، نام برند، نام مدل و ..."
                />
              </form>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main id="main">
      <div class="container">
        <div class="filter">
          <div class="filter__mobile">
            <button class="filter__mobile-button btn">
              <span class="filter__icon icon">
                <img src="assets/images/icons/sort.svg" alt="" />
                <img src="assets/images/icons/arrow-down.svg" alt="" />
              </span>
              محبوب ترین محصول
            </button>
            <button class="filter__mobile-button btn">
              <span class="filter__icon icon">
                <img src="assets/images/icons/filter.svg" alt="" />
              </span>
              فیلتر: برند محصول
            </button>
          </div>
          <div class="filter__desktop">
            <div class="filter__sort">
              <span class="filter-sort__icon icon">
                <img src="assets/images/icons/sort.svg" alt="" />
                <img src="assets/images/icons/arrow-down.svg" alt="" />
              </span>
              <ul class="filter-sort__menu">
                <li class="filter-sort__item active">محبوب ترین</li>
                <li class="filter-sort__item">پربازدید ترین</li>
                <li class="filter-sort__item">گران ترین</li>
                <li class="filter-sort__item">ارزان ترین</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
